[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Multi-agent RAG research assistant — backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# ── FastAPI ──────────────────────────────────────────────────────────────────
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sse-starlette = "^2.1.0"
python-multipart = "^0.0.9"

# ── LangChain / LangGraph ────────────────────────────────────────────────────
langchain = "^0.2.0"
langchain-community = "^0.2.0"
langchain-groq = "^0.1.3"
langgraph = "^0.1.0"
langsmith = "^0.1.0"

# ── LlamaIndex ───────────────────────────────────────────────────────────────
llama-index = "^0.10.0"
llama-index-vector-stores-chroma = "^0.1.0"
llama-index-embeddings-huggingface = "^0.2.0"

# ── Vector DB ────────────────────────────────────────────────────────────────
chromadb = "^0.5.0"

# ── Memory / Queue ───────────────────────────────────────────────────────────
redis = { extras = ["asyncio"], version = "^5.0.0" }
celery = { extras = ["redis"], version = "^5.4.0" }

# ── Database ─────────────────────────────────────────────────────────────────
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
aiosqlite = "^0.20.0"
alembic = "^1.13.0"

# ── Tools ────────────────────────────────────────────────────────────────────
tavily-python = "^0.3.0"
arxiv = "^2.1.0"
rank-bm25 = "^0.2.2"           # BM25 sparse retrieval for hybrid search

# ── Config / Logging ─────────────────────────────────────────────────────────
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
structlog = "^24.1.0"

# ── Evaluation ───────────────────────────────────────────────────────────────
ragas = "^0.1.0"
datasets = "^2.19.0"

# ── Misc ─────────────────────────────────────────────────────────────────────
httpx = "^0.27.0"
tenacity = "^8.3.0"
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
