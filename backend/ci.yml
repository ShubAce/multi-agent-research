name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + type-check + test ──────────────────────────────────────
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      REDIS_URL: redis://localhost:6379
      CHROMA_HOST: localhost
      CHROMA_PORT: 8001
      API_KEY: ci-test-key
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Lint with ruff
        working-directory: backend
        run: poetry run ruff check . && poetry run ruff format --check .

      - name: Type-check with mypy
        working-directory: backend
        run: poetry run mypy app/ --ignore-missing-imports
        continue-on-error: true   # don't fail CI on type errors yet

      - name: Run tests
        working-directory: backend
        run: |
          poetry run pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  # ── RAGAS evaluation gate (only on main) ───────────────────────────────────
  ragas-eval:
    name: RAGAS Evaluation Gate
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.ref == 'refs/heads/main'

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      REDIS_URL: redis://localhost:6379
      CHROMA_HOST: localhost
      CHROMA_PORT: 8001
      API_KEY: ci-test-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install poetry==1.8.2
      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Run RAGAS evaluation
        working-directory: backend
        run: poetry run python eval/ragas_eval.py --ci

      - name: Upload RAGAS report
        uses: actions/upload-artifact@v4
        with:
          name: ragas-report
          path: backend/eval/reports/

  # ── Frontend: lint + build ─────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type-check
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_KEY: ci-test-key

  # ── Deploy (only on main after all checks pass) ────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy frontend
        run: railway up --service frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}